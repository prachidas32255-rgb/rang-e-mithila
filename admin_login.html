<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Rang-e-Mithila</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #fff7f3;
            color: #4a2525;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {

            width: 400px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {

            color: #a7192e;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        h1 {

            color: #8f1d2c;

            margin-bottom: 30px;
        }

        .form-group {

            text-align: left;

            margin-bottom: 18px;
        }

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 10px;

            background: #8f1d2c;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #d99a2b;
        }

        .error {

            background: #ffe1e1;

            color: #a7192e;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;
        }

        .back {

            display: inline-block;

            margin-top: 20px;

            color: #8f1d2c;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            Rang-e-Mithila
        </div>

        <h1>Admin Login</h1>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Website
        </a>

    </div>

</body>

</html>
